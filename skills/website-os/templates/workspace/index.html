<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your website · Website OS</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/ui-build/ui.css"><link rel="stylesheet" href="/studio.css"></head><body>
<header class="toolbar"><a class="wordmark" href="/" aria-label="Website OS home"><span class="os-mark">w.</span><span>Website OS<small>Your website</small></span></a><nav aria-label="Website workspace"><button class="tab selected" data-tab="website" aria-selected="true">Website</button><button class="tab" data-tab="design" aria-selected="false">Design</button><button class="tab" data-tab="graphics" aria-selected="false">Graphics</button><button class="tab" data-tab="copy" aria-selected="false">Copy</button></nav><div class="toolbar-end"><span class="connection" id="connection">Connecting</span><button class="edit-button" id="edit">Edit page <span>↗</span></button></div></header>
<main>
<div class="canvas-workspace" id="canvas-workspace">
<div class="viewportbar"><div class="device-switch" role="group" aria-label="Preview size"><button aria-label="Desktop" data-device="desktop" class="chosen" aria-pressed="true"><span data-icon="Monitor"></span><span>Desktop</span></button><button aria-label="Tablet" data-device="tablet" aria-pressed="false"><span data-icon="Tablet"></span><span>Tablet</span></button><button aria-label="Mobile" data-device="mobile" aria-pressed="false"><span data-icon="Smartphone"></span><span>Mobile</span></button></div><div class="viewport-tools"><button id="resize-toggle" class="dimensions-button" aria-expanded="false" aria-controls="resize-controls"><span id="dimensions-label">1440 × 900</span><span data-icon="SlidersHorizontal"></span></button><button id="rotate" class="icon-button" aria-label="Rotate preview" title="Rotate preview"><span data-icon="RotateCw"></span></button><button id="fullscreen" class="icon-button" aria-label="Full screen preview" title="Full screen preview"><span data-icon="Maximize2"></span></button></div></div>
<div class="resize-controls" id="resize-controls" hidden><label>Width <input id="viewport-width" type="number" min="320" max="2560" value="1440" aria-label="Preview width in pixels"></label><input id="viewport-range" type="range" min="320" max="2560" step="1" value="1440" aria-label="Stress test viewport width"><label>Height <input id="viewport-height" type="number" min="320" max="2560" value="900" aria-label="Preview height in pixels"></label><span id="zoom-label">Fit to view</span></div>
<section class="stage" aria-label="Live homepage"><div class="canvasbar" id="canvasbar" hidden><span id="preview-label">Unsaved preview</span><button id="compare-saved">View saved</button><button id="discard">Discard</button></div><div class="device-frame" id="device-frame"><iframe id="homepage" src="/homepage.html" title="Your website live homepage"></iframe></div><span id="viewport-caption" class="viewport-caption">Desktop · scroll inside to explore</span></section>
</div>
<aside id="panel" hidden aria-label="Website tools"><div class="panel-top"><div><span class="eyebrow" id="panel-kicker">YOUR HOMEPAGE</span><h1 id="panel-title">Edit page</h1></div><button class="close" id="close" aria-label="Close panel">×</button></div><div id="panel-body"></div><div class="panel-actions" id="panel-actions"><p id="save-note">Edits appear in your homepage preview.</p><div><button class="secondary" id="preview">Preview changes</button><button class="primary" id="save" disabled>Save changes</button></div><button class="undo" id="undo">↶ Undo last saved change</button></div></aside>
</main><div class="toast" id="toast" role="status" hidden></div><script src="/ui-build/ui.js" defer></script><script src="/studio.js" defer></script></body></html>
